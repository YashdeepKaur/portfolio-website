<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Yashdeep Kaur</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <div class="box"></div>
            <div class="title">
                <span class="name">Yashdeep Kaur</span>
                <span class="slash">/</span>
                <span class="role">Software Developer</span>
            </div>
        </div>
        <nav class="navi">
            <ul>
                <li><a href="index.html">About Me</a></li>
                <li><a href="resume.html">Resume</a></li>
                <li><a href="project.html">Project</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-main">
      
        <div class="contact-header">
            <div class="blue-box"></div>
            <h1>Let's talk</h1>
        </div>

      
        <div class="contact-container">
            <form class="contact-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name *</label>
                        <input type="text" name="first-name" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name *</label>
                        <input type="text" name="last-name" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" name="email" required>
                </div>

                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" name="subject">
                </div>

                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="4" name="message"></textarea>
                </div>

                <button type="submit" class="submit-btn">Send</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-left">
                <p>© 2035 by Yashdeep Kaur. <br>CodeSquadz. All rights reserved.</p>
            </div>
            <div class="footer-right">
                <div class="footer-item">
                    <h4>Call</h4>
                    <p>+91 999 020 4862</p>
                </div>
                <div class="footer-item">
                    <h4>Write</h4>
                    <p>yashdeepkaur@gmail.com</p>
                </div>
                <div class="footer-item">
                    <h4>Follow</h4>
                    <div class="footer-icons">
                        <img src="assests/facebook-app-symbol.png" alt="FB">
                        <img src="assests/linkdin.png" alt="LI">
                        <img src="assests/twitter.png" alt="TW">
                        <img src="assests/instagram.png" alt="IG">
                    </div>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
